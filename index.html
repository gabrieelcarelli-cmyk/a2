<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nós Dois — Começando do Zero (100% Editável & localStorage)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: {
              950: '#070C16',
              900: '#0D1726',
              800: '#132238',
              700: '#1C314F',
              600: '#274268',
            },
            mint: {
              400: '#6EE7B7',
              300: '#86EFAC',
              200: '#A7F3D0',
              500: '#34D399',
            },
            offwhite: '#F4F7FB',
            slateish: '#94A6C1',
            coral: '#FCA5A5',
            amberish: '#FCD34D',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background: radial-gradient(circle at 50% 0%, #162844 0%, #070C16 78%);
      color: #F4F7FB;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(23, 39, 64, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 166, 193, 0.14);
      box-shadow: 0 12px 32px -8px rgba(4, 9, 20, 0.55);
    }
    .glass-subtle {
      background: rgba(28, 49, 79, 0.38);
      border: 1px solid rgba(148, 166, 193, 0.10);
    }
    .glass-pill {
      background: rgba(110, 231, 183, 0.12);
      border: 1px solid rgba(110, 231, 183, 0.28);
    }
    .tactile-btn {
      transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }
    .tactile-btn:active {
      transform: scale(0.95);
    }
    .tab-fade {
      animation: fadeSlideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .donut-ring {
      transition: stroke-dasharray 0.6s cubic-bezier(0.22, 1, 0.36, 1), stroke-dashoffset 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .progress-fill {
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .phone-frame {
      box-shadow: 0 25px 70px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .editable-hover {
      cursor: pointer;
      border-bottom: 1px dashed rgba(110, 231, 183, 0.45);
      transition: all 0.15s ease;
    }
    .editable-hover:hover {
      color: #6EE7B7;
      border-bottom-color: #6EE7B7;
      background: rgba(110, 231, 183, 0.12);
      border-radius: 4px;
      padding-inline: 3px;
    }
  </style>
</head>
<body class="antialiased selection:bg-mint-400 selection:text-midnight-950 py-0 sm:py-4 px-0 sm:px-4 flex flex-col items-center justify-start">

  <div id="appRoot" class="w-full flex flex-col items-center"></div>

  <script>
    // =========================================================================
    // VERSÃO "COMEÇANDO DO ZERO" (100% Editável + Assistente Inicial + localStorage)
    // =========================================================================
    const STORAGE_KEY = 'nos_dois_fresh_start_v1';

    const MONTH_NAMES = [
      { num: '01', short: 'Jan', full: 'Janeiro' },
      { num: '02', short: 'Fev', full: 'Fevereiro' },
      { num: '03', short: 'Mar', full: 'Março' },
      { num: '04', short: 'Abr', full: 'Abril' },
      { num: '05', short: 'Mai', full: 'Maio' },
      { num: '06', short: 'Jun', full: 'Junho' },
      { num: '07', short: 'Jul', full: 'Julho' },
      { num: '08', short: 'Ago', full: 'Agosto' },
      { num: '09', short: 'Set', full: 'Setembro' },
      { num: '10', short: 'Out', full: 'Outubro' },
      { num: '11', short: 'Nov', full: 'Novembro' },
      { num: '12', short: 'Dez', full: 'Dezembro' }
    ];

    function getBlankInitialData() {
      const now = new Date();
      const year = now.getFullYear();
      const monthIdx = now.getMonth();
      const meta = MONTH_NAMES[monthIdx];
      const currentKey = `${year}-${meta.num}`;

      return {
        onboardingCompleted: false,
        partner1: 'Parceiro(a) 1',
        partner2: 'Parceiro(a) 2',
        targetSplitP1: 50,
        privacyMode: false,
        activeTab: 'home',
        activeMonthKey: currentKey,
        expenseSubfilter: 'fixed',
        splitFilter: 'all',
        goals: [],
        months: {
          [currentKey]: {
            label: meta.short,
            fullName: meta.full,
            year,
            status: 'current',
            ceiling: 0,
            categoryBudgets: {
              Moradia: 0,
              Mercado: 0,
              Lazer: 0,
              Assinaturas: 0,
              Imprevistos: 0
            },
            incomes: [],
            expenses: []
          }
        }
      };
    }

    let state = (() => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return getBlankInitialData();
    })();

    let uiState = {
      editingKey: null,
      txModalOpen: false,
      coupleModalOpen: false,
      goalModalOpen: false,
      genMonthModalOpen: false,
      txType: 'expense',
      txSplit: '50/50',
      txSubType: 'fixed',
      onbSplitPreview: 50,
      toastMsg: null
    };

    function setState(updater) {
      state = typeof updater === 'function' ? updater(state) : { ...state, ...updater };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      renderApp();
    }

    function setUI(updater) {
      uiState = { ...uiState, ...(typeof updater === 'function' ? updater(uiState) : updater) };
      renderApp();
    }

    function showToast(msg) {
      uiState.toastMsg = msg;
      renderApp();
      setTimeout(() => {
        if (uiState.toastMsg === msg) {
          uiState.toastMsg = null;
          renderApp();
        }
      }, 2500);
    }

    function formatBRL(val) {
      if (state.privacyMode) return 'R$ ••••';
      return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function getNextMonthMeta() {
      const keys = Object.keys(state.months).sort();
      const lastKey = keys[keys.length - 1];
      const [yStr, mStr] = lastKey.split('-');
      let year = parseInt(yStr, 10);
      let mIdx = parseInt(mStr, 10);
      if (mIdx === 12) { mIdx = 1; year += 1; } else { mIdx += 1; }
      const meta = MONTH_NAMES[mIdx - 1];
      return { key: `${year}-${meta.num}`, year, label: meta.short, fullName: meta.full };
    }

    function computeMetrics(monthKey = state.activeMonthKey) {
      const m = state.months[monthKey] || state.months[Object.keys(state.months)[0]];
      const totalIncomeP1 = m.incomes.filter(i => i.partner === 'P1').reduce((a, b) => a + Number(b.amount), 0);
      const totalIncomeP2 = m.incomes.filter(i => i.partner === 'P2').reduce((a, b) => a + Number(b.amount), 0);
      const totalIncome = totalIncomeP1 + totalIncomeP2;

      const fixedExpenses = m.expenses.filter(e => e.type === 'fixed');
      const variableExpenses = m.expenses.filter(e => e.type === 'variable');

      const totalFixed = fixedExpenses.reduce((a, b) => a + Number(b.amount), 0);
      const totalVariable = variableExpenses.reduce((a, b) => a + Number(b.amount), 0);
      const totalExpense = totalFixed + totalVariable;

      const balance = totalIncome - totalExpense;
      const fixedPct = totalExpense > 0 ? Math.round((totalFixed / totalExpense) * 100) : 0;
      const variablePct = totalExpense > 0 ? 100 - fixedPct : 0;

      let p1Responsibility = 0;
      let p2Responsibility = 0;
      const p1Ratio = state.targetSplitP1 / 100;
      const p2Ratio = 1 - p1Ratio;

      m.expenses.forEach(e => {
        const amt = Number(e.amount);
        if (e.split === '50/50') {
          p1Responsibility += amt * 0.5;
          p2Responsibility += amt * 0.5;
        } else if (e.split === 'proportional') {
          p1Responsibility += amt * p1Ratio;
          p2Responsibility += amt * p2Ratio;
        } else {
          if (e.payer === 'P1') p1Responsibility += amt;
          else p2Responsibility += amt;
        }
      });

      return {
        m, totalIncomeP1, totalIncomeP2, totalIncome,
        fixedExpenses, variableExpenses, totalFixed, totalVariable,
        totalExpense, balance, fixedPct, variablePct,
        p1Responsibility, p2Responsibility
      };
    }

    // Inline Editing Components
    function renderInlineNumber(editKey, currentValue, onCommitCallbackName, prefix = '', extraClass = '') {
      if (state.privacyMode) return `<span class="${extraClass}">${prefix}R$ ••••</span>`;
      if (uiState.editingKey === editKey) {
        return `<input
          id="inline_input_${editKey}"
          type="number"
          step="0.01"
          value="${currentValue}"
          onblur="${onCommitCallbackName}(this.value)"
          onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') cancelInlineEdit();"
          onclick="event.stopPropagation()"
          class="w-24 rounded-lg bg-midnight-950 border border-mint-400 px-2 py-0.5 text-xs text-offwhite focus:outline-none"
        />`;
      }
      return `<span
        onclick="event.stopPropagation(); startInlineEdit('${editKey}')"
        title="Clique para editar este valor"
        class="editable-hover ${extraClass}"
      >${prefix}${formatBRL(currentValue)}</span>`;
    }

    function renderInlineText(editKey, currentText, onCommitCallbackName, extraClass = '') {
      if (uiState.editingKey === editKey) {
        return `<input
          id="inline_input_${editKey}"
          type="text"
          value="${currentText.replace(/"/g, '&quot;')}"
          onblur="${onCommitCallbackName}(this.value)"
          onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') cancelInlineEdit();"
          onclick="event.stopPropagation()"
          class="w-28 rounded-lg bg-midnight-950 border border-mint-400 px-2 py-0.5 text-xs text-offwhite focus:outline-none"
        />`;
      }
      return `<span
        onclick="event.stopPropagation(); startInlineEdit('${editKey}')"
        title="Clique para editar o nome"
        class="editable-hover ${extraClass}"
      >${currentText}</span>`;
    }

    window.startInlineEdit = function(key) {
      setUI({ editingKey: key });
      setTimeout(() => {
        const el = document.getElementById(`inline_input_${key}`);
        if (el) { el.focus(); el.select(); }
      }, 20);
    };

    window.cancelInlineEdit = function() {
      setUI({ editingKey: null });
    };

    window.commitPartnerName = function(which, val) {
      uiState.editingKey = null;
      const trimmed = String(val).trim();
      if (trimmed) {
        setState(prev => ({ ...prev, [which]: trimmed }));
        showToast('Nome atualizado!');
      } else { renderApp(); }
    };

    window.commitCeilingEdit = function(val) {
      const num = parseFloat(val);
      uiState.editingKey = null;
      if (!isNaN(num) && num >= 0) {
        const mKey = state.activeMonthKey;
        setState(prev => ({
          ...prev,
          months: { ...prev.months, [mKey]: { ...prev.months[mKey], ceiling: num } }
        }));
        showToast('Teto mensal atualizado!');
      } else { renderApp(); }
    };

    window.commitIncomeField = function(incId, field, val) {
      uiState.editingKey = null;
      const mKey = state.activeMonthKey;
      const parsed = field === 'amount' ? parseFloat(val) : String(val).trim();
      if (field === 'amount' && (isNaN(parsed) || parsed < 0)) { renderApp(); return; }
      if (field === 'title' && !parsed) { renderApp(); return; }

      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: {
            ...prev.months[mKey],
            incomes: prev.months[mKey].incomes.map(i => i.id === incId ? { ...i, [field]: parsed } : i)
          }
        }
      }));
      showToast('Entrada recalculada em tempo real!');
    };

    window.commitExpenseField = function(expId, field, val) {
      uiState.editingKey = null;
      const mKey = state.activeMonthKey;
      const parsed = field === 'amount' ? parseFloat(val) : String(val).trim();
      if (field === 'amount' && (isNaN(parsed) || parsed < 0)) { renderApp(); return; }
      if (field === 'title' && !parsed) { renderApp(); return; }

      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: {
            ...prev.months[mKey],
            expenses: prev.months[mKey].expenses.map(e => e.id === expId ? { ...e, [field]: parsed } : e)
          }
        }
      }));
      showToast('Despesa recalculada em tempo real!');
    };

    window.commitGoalField = function(goalId, field, val) {
      uiState.editingKey = null;
      const parsed = (field === 'current' || field === 'target') ? parseFloat(val) : String(val).trim();
      if ((field === 'current' || field === 'target') && (isNaN(parsed) || parsed < 0)) { renderApp(); return; }
      if (field === 'title' && !parsed) { renderApp(); return; }

      setState(prev => ({
        ...prev,
        goals: prev.goals.map(g => g.id === goalId ? { ...g, [field]: parsed } : g)
      }));
      showToast('Meta atualizada!');
    };

    // Onboarding Submit (Começando do zero)
    window.handleOnboardingSubmit = function(e) {
      e.preventDefault();
      const p1 = document.getElementById('onbP1Input').value.trim() || 'Parceiro(a) 1';
      const p2 = document.getElementById('onbP2Input').value.trim() || 'Parceiro(a) 2';
      const split = parseInt(document.getElementById('onbSplitInput').value, 10) || 50;
      const ceil = parseFloat(document.getElementById('onbCeilingInput').value) || 0;
      const mKey = state.activeMonthKey;

      setState(prev => ({
        ...prev,
        onboardingCompleted: true,
        partner1: p1,
        partner2: p2,
        targetSplitP1: split,
        months: {
          ...prev.months,
          [mKey]: { ...prev.months[mKey], ceiling: ceil }
        }
      }));
      showToast(`Bem-vindos, ${p1} & ${p2}!`);
    };

    // Interactive Actions
    window.toggleExpensePaid = function(expId) {
      const mKey = state.activeMonthKey;
      const target = state.months[mKey].expenses.find(e => e.id === expId);
      const nextPaid = target ? !target.paid : true;
      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: {
            ...prev.months[mKey],
            expenses: prev.months[mKey].expenses.map(e => e.id === expId ? { ...e, paid: nextPaid } : e)
          }
        }
      }));
      showToast(nextPaid ? `✓ "${target.title}" paga!` : `"${target.title}" pendente.`);
    };

    window.cycleExpenseSplit = function(expId) {
      const order = ['50/50', 'proportional', 'individual'];
      const mKey = state.activeMonthKey;
      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: {
            ...prev.months[mKey],
            expenses: prev.months[mKey].expenses.map(e => {
              if (e.id !== expId) return e;
              const nextSplit = order[(order.indexOf(e.split) + 1) % order.length];
              return { ...e, split: nextSplit };
            })
          }
        }
      }));
      showToast('Regra de divisão alterada!');
    };

    window.toggleIncomePartner = function(incId) {
      const mKey = state.activeMonthKey;
      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: {
            ...prev.months[mKey],
            incomes: prev.months[mKey].incomes.map(i => i.id === incId ? { ...i, partner: i.partner === 'P1' ? 'P2' : 'P1' } : i)
          }
        }
      }));
      showToast('Parceiro da entrada alternado!');
    };

    window.deleteIncome = function(incId) {
      const mKey = state.activeMonthKey;
      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: { ...prev.months[mKey], incomes: prev.months[mKey].incomes.filter(i => i.id !== incId) }
        }
      }));
      showToast('Entrada removida');
    };

    window.deleteExpense = function(expId) {
      const mKey = state.activeMonthKey;
      setState(prev => ({
        ...prev,
        months: {
          ...prev.months,
          [mKey]: { ...prev.months[mKey], expenses: prev.months[mKey].expenses.filter(e => e.id !== expId) }
        }
      }));
      showToast('Despesa removida');
    };

    window.deleteGoal = function(goalId) {
      setState(prev => ({
        ...prev,
        goals: prev.goals.filter(g => g.id !== goalId)
      }));
      showToast('Meta removida');
    };

    window.contributeGoal = function(goalId, amt) {
      setState(prev => ({
        ...prev,
        goals: prev.goals.map(g => g.id === goalId ? { ...g, current: Math.min(g.target, g.current + amt) } : g)
      }));
      showToast(`+${formatBRL(amt)} guardados!`);
    };

    window.handleNewTxSubmit = function(e) {
      e.preventDefault();
      const title = document.getElementById('txTitleInput').value.trim();
      const amount = parseFloat(document.getElementById('txAmountInput').value);
      const partner = document.getElementById('txPartnerInput').value;
      if (!title || isNaN(amount) || amount <= 0) return;

      const mKey = state.activeMonthKey;
      const m = state.months[mKey];

      if (uiState.txType === 'income') {
        const newInc = { id: 'inc_' + Date.now(), title, amount, partner, date: `Hoje • ${m.label}` };
        uiState.txModalOpen = false;
        setState(prev => ({
          ...prev,
          activeTab: 'income',
          months: {
            ...prev.months,
            [mKey]: { ...prev.months[mKey], incomes: [newInc, ...prev.months[mKey].incomes] }
          }
        }));
        showToast('Entrada cadastrada!');
      } else {
        const category = document.getElementById('txCategoryInput').value;
        const dueDay = parseInt(document.getElementById('txDueDayInput')?.value || '10', 10);
        const paid = (document.getElementById('txPaidInput')?.value || 'pending') === 'paid';
        const newExp = {
          id: 'exp_' + Date.now(), title, amount,
          type: uiState.txSubType, category, split: uiState.txSplit,
          payer: partner, paid: uiState.txSubType === 'fixed' ? paid : true,
          dueDay: uiState.txSubType === 'fixed' ? dueDay : null,
          date: `Hoje • ${m.label}`
        };
        uiState.txModalOpen = false;
        setState(prev => ({
          ...prev,
          activeTab: 'expenses',
          expenseSubfilter: uiState.txSubType,
          months: {
            ...prev.months,
            [mKey]: { ...prev.months[mKey], expenses: [newExp, ...prev.months[mKey].expenses] }
          }
        }));
        showToast('Despesa cadastrada!');
      }
    };

    window.handleCoupleSubmit = function(e) {
      e.preventDefault();
      const p1 = document.getElementById('cpP1Input').value.trim() || 'Parceiro(a) 1';
      const p2 = document.getElementById('cpP2Input').value.trim() || 'Parceiro(a) 2';
      const sp = parseInt(document.getElementById('cpSplitInput').value, 10) || 50;
      const ceil = parseFloat(document.getElementById('cpCeilInput').value) || 0;
      const mKey = state.activeMonthKey;
      uiState.coupleModalOpen = false;
      setState(prev => ({
        ...prev,
        partner1: p1,
        partner2: p2,
        targetSplitP1: sp,
        months: {
          ...prev.months,
          [mKey]: { ...prev.months[mKey], ceiling: ceil }
        }
      }));
      showToast('Nomes e acordo atualizados!');
    };

    window.handleGoalSubmit = function(e) {
      e.preventDefault();
      const title = document.getElementById('glTitleInput').value.trim();
      const target = parseFloat(document.getElementById('glTargetInput').value);
      const current = parseFloat(document.getElementById('glCurrentInput').value) || 0;
      const deadline = document.getElementById('glDeadlineInput').value.trim() || 'Sem prazo';
      if (!title || isNaN(target) || target <= 0) return;

      uiState.goalModalOpen = false;
      setState(prev => ({
        ...prev,
        goals: [...prev.goals, { id: 'g_' + Date.now(), title, icon: '✨', current, target, deadline }]
      }));
      showToast('Meta adicionada!');
    };

    window.handleGenMonthSubmit = function(e) {
      e.preventDefault();
      const cloneFixed = document.getElementById('gmCloneFixed').checked;
      const cloneIncome = document.getElementById('gmCloneIncome').checked;
      const nextMeta = getNextMonthMeta();
      const baseMonth = state.months[state.activeMonthKey];

      const newIncomes = [];
      if (cloneIncome) {
        baseMonth.incomes.forEach((inc, idx) => {
          newIncomes.push({
            id: `inc_${nextMeta.key}_${idx}_${Date.now()}`,
            title: inc.title,
            amount: inc.amount,
            partner: inc.partner,
            date: `Previsto • ${nextMeta.label}`
          });
        });
      }

      const newExpenses = [];
      if (cloneFixed) {
        baseMonth.expenses.filter(ex => ex.type === 'fixed').forEach((item, idx) => {
          newExpenses.push({
            id: `exp_${nextMeta.key}_fix_${idx}_${Date.now()}`,
            title: item.title,
            amount: item.amount,
            type: 'fixed',
            category: item.category || 'Moradia',
            split: item.split || '50/50',
            payer: item.payer || 'P1',
            paid: false,
            dueDay: item.dueDay || 10
          });
        });
      }

      uiState.genMonthModalOpen = false;
      setState(prev => ({
        ...prev,
        activeMonthKey: nextMeta.key,
        months: {
          ...prev.months,
          [nextMeta.key]: {
            label: nextMeta.label,
            fullName: nextMeta.fullName,
            year: nextMeta.year,
            status: 'future',
            ceiling: baseMonth.ceiling || 0,
            categoryBudgets: { ...baseMonth.categoryBudgets },
            incomes: newIncomes,
            expenses: newExpenses
          }
        }
      }));
      showToast(`✨ ${nextMeta.fullName} ${nextMeta.year} criado!`);
    };

    window.resetToZero = function() {
      localStorage.removeItem(STORAGE_KEY);
      state = getBlankInitialData();
      uiState.onbSplitPreview = 50;
      renderApp();
      showToast('Aplicativo zerado para novo começo!');
    };

    // =========================================================================
    // RENDERIZADOR PRINCIPAL
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('appRoot');
      const nextMeta = getNextMonthMeta();
      const data = computeMetrics();
      const {
        m, totalIncomeP1, totalIncomeP2, totalIncome,
        fixedExpenses, variableExpenses, totalFixed, totalVariable,
        totalExpense, balance, fixedPct, variablePct,
        p1Responsibility, p2Responsibility
      } = data;

      const remainingCeiling = Math.max(0, m.ceiling - totalExpense);
      const ceilingPct = m.ceiling > 0 ? Math.min(100, Math.round((totalExpense / m.ceiling) * 100)) : 0;
